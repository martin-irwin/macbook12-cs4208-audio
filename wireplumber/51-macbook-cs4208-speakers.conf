# MacBook10,1 internal speakers: the external amp only accepts 16-bit/44.1 kHz.
# cs4208-speakerd (system service) replays the amp init when playback starts.
monitor.alsa.rules = [
  {
    # The speakers are fed digitally (converter 0x0a) and ignore the hardware
    # Master control, so let PipeWire do volume in software for this card.
    matches = [ { device.name = "alsa_card.pci-0000_00_1f.3" } ]
    actions = { update-props = { api.alsa.soft-mixer = true } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_00_1f.3.analog-stereo" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 44100
        audio.allowed-rates = [ 44100 ]
      }
    }
  }
]
